<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">AbotVida logo</title>
  <desc id="desc">A navy and orange AV ribbon monogram with a credit card detail, AbotVida wordmark, and the tagline Get What You Need Today.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB21A"/>
      <stop offset="0.48" stop-color="#FF7900"/>
      <stop offset="1" stop-color="#F4510B"/>
    </linearGradient>
    <style>
      .navy { fill: #103568; }
      .orange { fill: url(#orange); }
      .word { font-family: Arial, Helvetica, sans-serif; font-weight: 800; }
      .tag { font-family: Arial, Helvetica, sans-serif; font-weight: 600; letter-spacing: 10px; }
    </style>
  </defs>
  <rect width="1200" height="900" fill="#FFFFFF"/>
  <!-- AV ribbon mark: outer A arch flows into the right-hand V -->
  <g id="av-mark" transform="translate(0 5)">
    <path class="navy" d="M220 515 L425 150
      C466 78 530 45 600 45
      C671 45 735 80 775 150
      L900 365
      L842 470
      L735 285
      C704 232 659 205 600 205
      C541 205 496 232 465 285
      L335 515 Z"/>
    <path class="orange" d="M220 515
      C300 425 383 365 475 330
      C559 297 655 298 733 337
      C788 365 824 411 862 456
      L1010 185
      L1125 185
      L929 525
      C906 565 870 590 827 590
      C780 590 746 565 715 528
      L660 462
      C614 406 548 393 485 415
      C405 443 349 493 300 515 Z"/>
    <!-- Card sits within the A counter -->
    <g id="card" transform="rotate(-16 615 275)">
      <rect x="495" y="220" width="255" height="145" rx="22" fill="#103568" stroke="#FFFFFF" stroke-width="13"/>
      <rect x="526" y="260" width="54" height="48" rx="8" fill="#FFB21A"/>
      <path d="M544 260 V308 M562 260 V308 M526 284 H580" stroke="#F28A00" stroke-width="5"/>
      <path d="M614 270 H706 M614 300 H690" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    </g>
    <!-- Three small accent rays -->
    <g fill="#FF7900" stroke="#FF7900" stroke-linecap="round" stroke-width="22">
      <path d="M1062 112 L1080 72"/>
      <path d="M1105 135 L1140 104"/>
      <path d="M1128 176 L1170 160"/>
    </g>
  </g>
  <!-- Wordmark -->
  <text x="600" y="700" text-anchor="middle" font-size="126" class="word">
    <tspan fill="#103568">Abot</tspan><tspan fill="#FF7900">Vida</tspan>
  </text>
  <text x="600" y="775" text-anchor="middle" font-size="31" class="tag" fill="#103568">GET WHAT YOU NEED TODAY.</text>
</svg>
