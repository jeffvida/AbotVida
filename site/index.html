  const form = e.target.closest('form[data-form]'); if(!form) return;
  e.preventDefault();
  const k = form.dataset.form;
  if (k==='quote') submitQuote(form);
  else if (k==='product') submitProduct(form);
  else if (k==='approve') submitApprove(form);
  else if (k==='pay') submitPay(form);
  else if (k==='newpurchase') submitNewPurchase(form);
  else if (k==='editacct') submitEditAcct(form);
  else if (k==='card') submitCard(form);
  else if (k==='review') submitReview(form);
  else if (k==='custom') submitCustom(form);
  else if (k==='balance') submitBalance(form);
  else if (k==='login') ownerLogin(form);
  else if (k==='pwchange') changeOwnerPassword(form);
  else if (k==='note'){
    const text = (form.elements.text.value||'').trim(); if(!text){ toast('Write a note first'); return; }
    S.notes.push({ id:uid('n'), key:form.dataset.key, accountId: form.dataset.acct || (form.elements.about?.value||''), text, at:Date.now() });
    save(); renderModal(); render(); toast('Note saved');
  }
  else if (k==='settings'){
    const f = Object.fromEntries(new FormData(form));
    Object.assign(S.settings, { shopName:f.shopName.trim()||'AbotVida', tagline:(f.tagline||'').trim(), messengerUrl:f.messengerUrl.trim(), ownerEmail:f.ownerEmail.trim(), dueSoonDays:Math.max(1,Math.min(31,+f.dueSoonDays||7)), reminderTemplate:f.reminderTemplate.trim()||S.settings.reminderTemplate, penaltyEn:(f.penaltyEn||'').trim(),
      ...(API_URL ? { autoEmail: !!f.autoEmail } : {}), newCustLimit: f.newCustLimit==='' ? '' : Math.max(0, Math.round(+f.newCustLimit||0)), chatOn: !!f.chatOn,
      shopInfo:{ fbPage:(f.si_fbPage||'').trim(), location:(f.si_location||'').trim(), hours:(f.si_hours||'').trim(), deliveryAreas:(f.si_deliveryAreas||'').trim(), dtiNo:(f.si_dtiNo||'').trim(), privacyEmail:(f.si_privacyEmail||'').trim() } });
    save(); render(); toast('Settings saved');
  }
});

/* ============================================================
   CHAT ASSISTANT (shop only)
   ============================================================ */
// A bubble on the right side of the shop. Questions go to /api/chat on our Cloudflare Worker, which asks Gemini
// using the live catalog and FAQ. Monthly amounts come from the Worker's code, not from the AI.
// In the preview (no API_URL) simple built-in answers stand in for the AI.
const CHAT_KEY = 'abotvida-chat', CHAT_NOTE = 'abotvida-chat-note';
const CHAT_HELLO = "Hi! I'm the AbotVida Assistant. Ask me about our items, monthly payments, requirements or delivery. Puwede ka ring magtanong sa Tagalog.";
const CHAT_QUICK = ['How does it work?','What do I need?','How much per month?','Do you deliver?'];
const CHAT_ERR = { off:"The assistant isn't available right now. Please message us on Messenger and we'll reply there.", limit:"We've had a lot of questions today. Please message us on Messenger and we'll reply there.", busy:"I couldn't answer that just now. Please try again, or message us on Messenger.", net:"I couldn't connect. Check your internet and try again." };
const CHAT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg>';
const SEND_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>';
const CH = { open:false, msgs:[], busy:false, avail: !API_URL, noteT:null };
try{ const raw = sessionStorage.getItem(CHAT_KEY); if (raw){ const d = JSON.parse(raw); if (Array.isArray(d)) CH.msgs = d.slice(-30); } }catch(e){}
const chatSave = () => { try{ sessionStorage.setItem(CHAT_KEY, JSON.stringify(CH.msgs.slice(-30))); }catch(e){} };
const chatRoot = document.createElement('div'); chatRoot.id = 'chat-root'; document.body.appendChild(chatRoot);

function chatFmt(text){
  const lines = esc(text).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[\[p:([\w-]+)\]\]/g,(m,id)=>{ const p=S.products.find(x=>x.id===id); return p?`<a class="chat-prod" href="#item-${esc(p.id)}" data-chat="go">${esc(fullName(p))}</a>`:''; }).split('\n');
  let out = '', list = false;
  lines.forEach(l=>{ const m = /^\s*[-*•]\s+(.*)$/.exec(l);
    if (m){ if(!list){ out+='<ul>'; list=true; } out+=`<li>${m[1]}</li>`; }
    else { if(list){ out+='</ul>'; list=false; } if (l.trim()) out+=`<p>${l}</p>`; } });
  return out + (list?'</ul>':'');
}
function chatLogHTML(){
  const bub = (who, html, cls='') => `<div class="cmsg ${who} ${cls}">${html}</div>`;
  return bub('bot', chatFmt(CHAT_HELLO)) + CH.msgs.map(m=>bub(m.role==='user'?'me':'bot', m.role==='user'?`<p>${esc(m.text)}</p>`:chatFmt(m.text), m.local?'note':'')).join('')
    + (CH.busy?'<div class="cmsg bot typing" aria-label="Typing"><i></i><i></i><i></i></div>':'');
}
function chatRender(keepInput){
  const show = view!=='owner' && CH.avail && S.settings.chatOn!==false;
  chatRoot.hidden = !show;
  document.body.classList.toggle('chat-open', show && CH.open);
  if (!show) return;
  const m = msgrHref(), live = m && !/^https?:\/\/m\.me\/?$/i.test(m);
  const typed = keepInput ? (document.getElementById('chat-in')?.value||'') : '';
  chatRoot.innerHTML = `
    ${CH.open?`<section class="chat-panel" role="dialog" aria-label="Chat with AbotVida Assistant">
      <header class="chat-head">${logoMark()}<div style="min-width:0"><b>AbotVida Assistant</b><span>AI helper · we confirm everything on Messenger</span></div>
        ${live?`<a class="iconbtn" href="${esc(m)}" target="_blank" rel="noopener" aria-label="Message us on Messenger" title="Message us on Messenger">${I.msgr}</a>`:''}
        <button class="iconbtn" data-chat="close" aria-label="Close chat">${I.x}</button></header>
      <div class="chat-log" id="chat-log" aria-live="polite">${chatLogHTML()}</div>
      ${!CH.msgs.length?`<div class="chat-quick">${CHAT_QUICK.map(q=>`<button class="chip" data-chat="ask" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`:''}
      ${live&&CH.msgs.length?`<a class="chat-msgr" href="${esc(m)}" target="_blank" rel="noopener">${I.msgr}<span>Talk to us on Messenger</span></a>`:''}
      <form class="chat-form" data-chat-form><label for="chat-in" class="sr">Your question</label><input id="chat-in" class="input" autocomplete="off" maxlength="600" placeholder="Type your question…" enterkeyhint="send" value="${esc(typed)}"><button class="chat-send" type="submit" aria-label="Send" ${CH.busy?'disabled':''}>${SEND_ICON}</button></form>
      <p class="chat-foot">AI assistant. Answers can be wrong, and only the owner approves requests. Don't share IDs, card numbers or addresses here.</p>
    </section>`:''}
    <div class="chat-note" id="chat-note" hidden><button class="chat-note-txt" data-chat="open">Hi! 👋 Questions about monthly payments or requirements? Ask me.</button><button class="chat-note-x" data-chat="note-x" aria-label="Close message">${I.x}</button></div>
    <button class="chat-fab" data-chat="toggle" aria-label="${CH.open?'Close chat':'Chat with AbotVida Assistant'}" aria-expanded="${CH.open}">${CH.open?I.x:CHAT_ICON}</button>`;
  const log = document.getElementById('chat-log'); if (log) log.scrollTop = log.scrollHeight;
}
function chatNote(){
  clearTimeout(CH.noteT);
  let seen = false; try{ seen = !!sessionStorage.getItem(CHAT_NOTE); }catch(e){}
  if (seen) return;
  CH.noteT = setTimeout(()=>{ const n = document.getElementById('chat-note'); if (n && !CH.open && !M && !chatRoot.hidden){ n.hidden = false; try{ sessionStorage.setItem(CHAT_NOTE,'1'); }catch(e){} } }, 3000);
}
function chatOpen(on){
  CH.open = on; try{ sessionStorage.setItem(CHAT_NOTE,'1'); }catch(e){}
  chatRender(); if (on) setTimeout(()=>document.getElementById('chat-in')?.focus({preventScroll:true}), 30); else chatRoot.querySelector('.chat-fab')?.focus();
}
async function chatAsk(text){
  text = String(text||'').trim().slice(0,600); if (!text || CH.busy) return;
  CH.msgs.push({role:'user', text}); CH.busy = true; chatSave(); chatRender();
  let reply = null, err = '';
  if (!API_URL){ await new Promise(r=>setTimeout(r,500)); reply = demoReply(text); }
  else {
    try{
      const hist = CH.msgs.filter(m=>!m.local).slice(-12).map(m=>({role:m.role, text:m.text}));
      const r = await fetch('/api/chat', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ messages: hist }) });
      const d = await r.json(); if (d && d.ok) reply = d.reply; else err = (d && CHAT_ERR[d.error]) ? d.error : 'busy';
    }catch(e){ err = 'net'; }
  }
  CH.busy = false;
  CH.msgs.push(reply ? {role:'assistant', text:reply} : {role:'assistant', text:CHAT_ERR[err], local:true});
  chatSave(); chatRender();
}
// Preview only: simple built-in answers so the chat can be tried without the AI. The live shop uses Gemini.
function demoReply(text){
  const t = text.toLowerCase(), words = t.split(/[^a-z0-9]+/).filter(w=>w.length>2);
  const score = p => { const n = fullName(p).toLowerCase(); return words.filter(w=>n.includes(w)).length; };
  const best = S.products.map(p=>[p,score(p)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1])[0];
  if (best){ const p = best[0], sc = dpOf(p);
    if (p.status==='Out of stock') return `[[p:${p.id}]] is out of stock right now. You can still ask us on Messenger, or try "Request any item".`;
    return `[[p:${p.id}]]\n- Item price: **${peso(p.price)}**\n- Service charge (paid upfront): **${peso(sc)}**\n` + p.durations.map(m=>{ const pl=plan(p.price,m); return m===1?`- 1 month: **${peso(p.price)}** after 1 month`:`- ${m} months: **${peso(pl.monthly)}**/month${pl.last!==pl.monthly?` (last month ${peso(pl.last)})`:''}`; }).join('\n') + `\nTotal: ${peso(sc+p.price)}. Open the item and tap "Request installment" to send a request.`; }
  if (/how much|magkano|per month|monthly|buwan/.test(t)) return 'Which item are you looking at? Tell me the name, like "Galaxy A56" or "55 inch TV", and I\'ll show the monthly amounts.';
  if (/need|requir|kailangan|id\b|atm/.test(t)) return 'To request, you only need your name and mobile number.\n- Once approved, we\'ll ask for a valid ID and your ATM card.\n- Please don\'t send IDs or card numbers in this chat.';
  if (/deliver|hatid|ship|meet/.test(t)) return 'Small items have free delivery or meet-up. For large items like TVs and appliances, the delivery charge is already included in the price. Message us to check your area.';
  if (/work|paano|how does|process|service charge|dp\b|down/.test(t)) return 'Here\'s how it works:\n- You pay a one-time **service charge** upfront. It isn\'t deducted from the item price.\n- The item price is then paid monthly, in whole pesos.\n- Total = service charge + item price.\nWe review every request, then message you.';
  if (/late|penalty|multa/.test(t)) return penaltyText() || 'Please message us before your due date if you can\'t pay on time.';
  return 'This is the preview, so I only know a few answers here. On the live shop the AI answers this. You can also message us on Messenger.';
}
chatRoot.addEventListener('click', e=>{
  const el = e.target.closest('[data-chat]'); if (!el) return;
  const a = el.dataset.chat;
  if (a==='toggle') chatOpen(!CH.open);
  else if (a==='open'){ chatOpen(true); }
  else if (a==='close') chatOpen(false);
  else if (a==='note-x'){ document.getElementById('chat-note').hidden = true; }
  else if (a==='ask') chatAsk(el.dataset.q);
  else if (a==='go'){ if (isPhone()) { CH.open=false; chatRender(); } }
});
chatRoot.addEventListener('submit', e=>{ e.preventDefault(); const i = document.getElementById('chat-in'); const v = i.value; i.value=''; chatAsk(v); });
chatRoot.addEventListener('keydown', e=>{ if (e.key==='Escape' && CH.open){ e.stopPropagation(); chatOpen(false); } });
async function chatInit(){
  if (API_URL){ try{ const r = await fetch('/api/chat'); const d = await r.json(); CH.avail = !!(d && d.on); }catch(e){ CH.avail = false; } }
  chatRender(); if (view!=='owner') chatNote();
}

if (API_URL) initSync();
route();
chatInit();
</script>
