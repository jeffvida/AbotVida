<style>
/* Layout: light, Shopee-style mobile shop: sticky search bar → promo banners → category icons → hot picks row → 2-column product grid → product page with sticky request bar. Owner dashboard shares the tokens. */
:root{
  color-scheme: light;
  /* AbotVida brand: navy #14234B, orange #F7801E, spark yellow #F5A623 (logo accent only) */
  --navy:#14234B; --orange:#F7801E; --spark:#F5A623;
  /* Logo colors, from abotvida-logo.svg */
  --logo-navy:#103568; --logo-orange:#FF7900;
  --page:#F6F7FA; --bg:#FFFFFF; --surface:#F2F4F8; --raised:#FFFFFF; --ink:#14234B; --muted:#5D6681; --line:#E4E8F0;
  --accent:#F7801E; --accent-soft:#FFF1E4; --accent-strong:#C65F0A; --on-accent:#14234B;
  --ok:#1E8A5A; --ok-soft:#E8F6EE; --warn:#946100; --warn-soft:#FFF6DC; --bad:#C0392B; --bad-soft:#FDEDEA; --info:#2F5FB0; --info-soft:#EAF0FB;
  --tone-a:#FFF1E4; --tone-b:#E9EEF8; --tone-c:#EAF7EE;
  --overlay:rgba(20,35,75,.4);
  --shadow:0 1px 2px rgba(20,35,75,.05),0 6px 20px rgba(20,35,75,.08);
  --warn-line:#F3DFA6; --bicon:rgba(255,255,255,.8);
  --f-display:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
:root[data-shop-theme="dark"]{
  color-scheme: dark;
  --page:#0D142C; --bg:#141C39; --surface:#1C2649; --raised:#172042; --ink:#EEF1F8; --muted:#A8B1CB; --line:#2A3560;
  --accent:#F7801E; --accent-soft:#3A2613; --accent-strong:#FF9B47; --on-accent:#14234B;
  --ok:#62D39C; --ok-soft:#163027; --warn:#F2C35A; --warn-soft:#332A14; --bad:#F28B80; --bad-soft:#3D211E; --info:#8DB0F2; --info-soft:#1B2A4C;
  --tone-a:#33231A; --tone-b:#1C2952; --tone-c:#183028;
  --overlay:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --warn-line:#5A4A1E; --bicon:rgba(255,255,255,.08);
  --logo-navy:#FFFFFF; /* reversed A on dark backgrounds */
}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
#syncbadge[data-state="bad"]{color:var(--bad);font-weight:600}
#syncbadge[data-state="busy"]{color:var(--muted)}
body{background:var(--page);color:var(--ink);transition:background-color .2s,color .2s;font-family:var(--f-body);font-weight:500;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:800;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent-strong)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--raised);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.04)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;border-color:transparent;padding-inline:10px}
.btn.ghost:hover{background:var(--surface)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.msgr-icon{width:18px;height:18px;flex:none}

/* Prototype bar + header */
.protobar{background:var(--accent-soft);color:var(--ink);font-size:13px}
.protobar .wrap{padding-block:7px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.protobar b{color:var(--accent-strong)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em;margin-right:auto;background:none;border:0;cursor:pointer;padding:0}
.logo .mark{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;overflow:hidden}
.logo .mark img{width:100%;height:100%;object-fit:contain}
.mark.av{width:60px;height:35px;border-radius:0;overflow:visible;flex:none;display:block}
.mark.av svg{width:100%;height:100%;display:block;overflow:visible}
@media (max-width:560px){.logo .mark.av{width:52px;height:30px}}
.logo-ph{border:1.5px dashed var(--muted);background:var(--surface);color:var(--muted);font-size:13px;font-weight:800;letter-spacing:.02em}
.logo-ph i{font-style:normal;color:var(--orange)}
.wmwrap{display:grid;line-height:1.05;text-align:left}
.wm{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em;color:var(--logo-navy)}
:root[data-shop-theme="dark"] .wm{color:#FFFFFF}
.wm .v{color:var(--logo-orange)}
.tagline{font-weight:600;font-style:italic;font-size:11.5px;color:var(--muted);letter-spacing:0;margin-top:2px}
.logo small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:-2px}
.topnav{display:flex;gap:4px;align-items:center}
@media (max-width:720px){.topnav .hide-sm{display:none}}

/* Sections */
section.block{padding-block:40px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-head h2{font-size:clamp(24px,3vw,32px);font-weight:700}

/* Filters */
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;min-width:0;flex:1 1 auto}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--raised);padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .ct{opacity:.6;font-weight:500;margin-left:4px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:var(--raised);min-width:0;flex:0 1 260px}
.search input{border:0;outline:0;background:transparent;width:100%;min-width:0}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--surface);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.accent{background:var(--accent-soft);color:var(--accent-strong)}
.pill.plain::before{display:none}
.sample{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--raised);color:var(--muted);border:1px solid var(--line)}

footer{border-top:1px solid var(--line);margin-top:40px}
footer .wrap{padding-block:24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.fbrand{display:grid;gap:2px;flex-basis:100%}
.fbrand .wm{font-size:18px}
.flock{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.flock .mark.av{width:48px;height:28px}

/* Modal */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--bg);border-radius:20px;width:100%;max-width:880px;box-shadow:var(--shadow);position:relative;margin-block:auto}
.modal.narrow{max-width:560px}
.modal .m-head{display:flex;justify-content:space-between;align-items:start;gap:12px;padding:20px 22px 0}
.modal .m-body{padding:18px 22px 22px}
.xbtn{border:0;background:var(--surface);width:36px;height:36px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none;color:var(--ink)}
.xbtn svg{width:16px;height:16px}
.offer{display:grid;grid-template-columns:.9fr 1.1fr;gap:24px}
@media (max-width:720px){.offer{grid-template-columns:1fr}}
.offer .thumb{border-radius:var(--r)}
.offer .desc{margin-top:14px;color:var(--muted);font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-top:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right}
.months{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.mo{border:1.5px solid var(--line);background:var(--raised);border-radius:12px;padding:10px 6px;cursor:pointer;text-align:center;line-height:1.2}
.mo b{display:block;font-family:var(--f-display);font-size:18px}
.mo span{font-size:12px;color:var(--muted)}
.mo[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mo[aria-checked="true"] span{color:var(--accent-strong)}
.summary{margin-top:18px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.summary .s-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px}
.summary .s-row + .s-row{border-top:1px solid var(--line)}
.summary .s-row.hl{background:var(--accent-soft)}
.summary .lbl{font-weight:600}
.summary .lbl small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.summary .val{font-family:var(--f-display);font-weight:700;font-size:22px;text-align:right;white-space:nowrap}
.summary .val small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:12px;display:flex;gap:8px}
.note svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--accent-strong)}

/* Forms */
.form{display:grid;gap:14px}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.form .row2{grid-template-columns:1fr}}
.field{display:grid;gap:6px;min-width:0}
.field label,.field .lab{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted);font-weight:400}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:10px 12px;min-width:0}
textarea.input{min-height:80px;resize:vertical}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;font-weight:500}
.mini-summary{background:var(--surface);border-radius:12px;padding:14px 16px;display:grid;gap:6px;font-size:14px}
.mini-summary div{display:flex;justify-content:space-between;gap:12px}
.mini-summary b{font-variant-numeric:tabular-nums}
.err{color:var(--bad);font-size:13px}
.done{text-align:center;padding:10px 0}
.done .tick{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px}
.done .tick svg{width:28px;height:28px}
.ref{font-family:var(--f-display);font-weight:700;font-size:20px;background:var(--surface);display:inline-block;padding:6px 14px;border-radius:10px;margin-top:10px}
.copybox{background:var(--surface);border-radius:12px;padding:12px 14px;font-size:13px;white-space:pre-wrap;text-align:left;margin-top:14px;user-select:all}

/* Owner */
.owner{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;padding-block:24px 40px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:flex;flex-direction:column;gap:2px}
.rail button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted)}
.rail button:hover{background:var(--surface);color:var(--ink)}
.rail button[aria-current="page"]{background:var(--surface);color:var(--ink)}
.rail .cnt{font-size:12px;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:1px 7px}
.rail .cnt.bad{background:var(--bad);color:var(--bg)}
@media (max-width:860px){
  .owner{grid-template-columns:1fr;gap:16px}
  .rail{position:static;flex-direction:row;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);padding-bottom:8px}
  .rail::-webkit-scrollbar{display:none}
  .rail button{white-space:nowrap}
}
.o-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.o-head h2{font-size:26px}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:22px}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;background:var(--raised);text-align:left;cursor:pointer}
.tile:hover{border-color:var(--muted)}
.tile .t-lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .t-val{font-family:var(--f-display);font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile.bad .t-val{color:var(--bad)}
.tile.warn .t-val{color:var(--warn)}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:1000px){.panels{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--raised);min-width:0}
.panel .p-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel .p-head h3{font-size:16px;font-family:var(--f-body);font-weight:700}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .who{min-width:0}
.li .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .who span{font-size:13px;color:var(--muted)}
.li .right{text-align:right;flex:none;display:flex;flex-direction:column;align-items:end;gap:4px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--raised)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td .sub{display:block;font-size:12.5px;color:var(--muted)}
td.actions{white-space:nowrap;text-align:right}
td.actions .btn + .btn{margin-left:6px}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface)}
.prodcell{display:flex;align-items:center;gap:10px;min-width:220px}
.prodcell .mini{width:44px;height:44px;border-radius:8px;flex:none;aspect-ratio:auto}
.prodcell .mini .ph{width:70%}
.bar{height:6px;border-radius:99px;background:var(--surface);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.callout{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:start;margin-bottom:16px}
.callout svg{width:18px;height:18px;flex:none;color:var(--info);margin-top:1px}
.callout b{color:var(--ink)}
.rem-group{margin-bottom:22px}
.rem-group h3{font-size:17px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rem{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--raised);display:grid;gap:10px;margin-bottom:10px}
.rem .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rem .msg{background:var(--surface);border-radius:10px;padding:10px 12px;font-size:14px;user-select:all}
.rem .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.integr{display:grid;gap:8px}
.integr .li{border:1px solid var(--line);border-radius:12px}
.integr .li + .li{border-top:1px solid var(--line)}
.infogrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:640px){.infogrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.infogrid div{background:var(--surface);border-radius:12px;padding:10px 12px;min-width:0}
.infogrid span{display:block;font-size:12px;color:var(--muted)}
.infogrid b{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.m-sec{font-family:var(--f-body);font-size:15px;font-weight:700;margin:22px 0 10px}
.note-form{margin-bottom:12px}
.timeline{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--raised)}
.timeline > p{padding:12px 14px}
.note-item{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:4px}
.note-item:first-child{border-top:0}
.note-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.note-item p{font-size:14px;overflow-wrap:anywhere}
.linkbtn{background:none;border:0;padding:0;font-weight:700;color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;text-align:left}
.linkbtn:hover{text-decoration-color:var(--accent)}
/* Easier reading on the customer pages */
body.is-shop{font-size:16px}
body.is-shop .btn{padding:12px 18px;font-size:15px}
body.is-shop .btn.sm{padding:9px 14px;font-size:14px}
body.is-shop .chip{padding:10px 16px;font-size:15px}
body.is-shop .chip.sm{padding:7px 12px;font-size:13px}
body.is-shop .mo{padding:12px 6px}
body.is-shop .mo span{font-size:13px}
body.is-shop .summary .lbl small{font-size:13.5px}
body.is-shop .note,body.is-shop .small{font-size:14px}
body.is-shop .input{padding:12px 14px;font-size:16px}
body.is-shop .step p{font-size:15px}
/* Offer info + penalty */
.infobox{margin-top:16px;border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.ib-title{font-weight:700;font-size:14px}
.ib-row{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.ib-row svg,.penalty svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--muted)}
.penalty{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:12px;padding:12px 14px;font-size:14px}
.penalty svg{color:var(--warn)}
.penalty b{display:block;color:var(--warn)}
.penalty .agree{display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:600;cursor:pointer}
.penalty .agree input{width:18px;height:18px}
@media (max-width:720px){
  .offer > div:first-child{order:2}
  .offer .thumb{aspect-ratio:16/9}
}
/* Happy customers */
.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:780px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
.g-tile{margin:0;border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.g-tile img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.g-ph{aspect-ratio:1/1;display:grid;place-content:center;justify-items:center;gap:8px;color:var(--muted);font-size:13px;text-align:center;padding:12px}
.g-ph svg{width:34px;height:34px;opacity:.7}
.g-tile figcaption{padding:8px 12px;font-size:14px;font-weight:600}
.g-edit{padding:10px;display:grid;gap:8px;background:var(--raised)}
.g-add{border-style:dashed;cursor:pointer;min-height:160px;font-weight:600;color:var(--muted);align-items:center;justify-content:center;font-size:14px}
.reviews{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.reviews{grid-template-columns:1fr}}
.reviews .empty{grid-column:1/-1}
.review{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;background:var(--raised);min-width:0}
.review p{overflow-wrap:anywhere}
.r-by{font-size:14px;color:var(--muted)}
.r-by b{color:var(--ink)}
.stars{color:var(--accent);letter-spacing:2px;font-size:16px}
.stars .off{color:var(--line)}
.rate{display:flex;gap:4px}
.rstar{border:0;background:none;font-size:34px;line-height:1;color:var(--line);cursor:pointer;padding:2px}
.rate .rstar[aria-checked="true"], .rate:has(.rstar[aria-checked="true"]) .rstar:has(~ .rstar[aria-checked="true"]){color:var(--accent)}
.agree-line{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.agree-line input{width:18px;height:18px;margin-top:1px}
.nf{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hotbtn{border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:4px}
.hotbtn[aria-pressed="true"]{color:var(--accent)}
.phgrid{display:flex;gap:8px;flex-wrap:wrap}
.ph-t{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:11px;color:var(--muted);text-align:center;flex:none}
.ph-t img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph-t .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:14px;line-height:24px;padding:0}
.ph-t .mk{position:absolute;left:4px;bottom:4px;font-size:10.5px;font-weight:700;border:0;border-radius:5px;padding:2px 6px;cursor:pointer;background:rgba(0,0,0,.6);color:#fff}
.ph-t .mk.on{background:var(--accent);color:var(--on-accent);cursor:default}
.ph-add{border-style:dashed;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--ink)}
.ph-links summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:4px}
/* ===== Shop (Shopee-style) ===== */
.thumb{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--surface);display:grid;place-items:center;color:var(--muted);overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--raised)}
.thumb .ph{width:46%;height:auto;opacity:.75}
.thumb .badges{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;z-index:1}
.empty{padding:32px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);background:var(--bg)}
.shopbar .wrap{gap:10px}
.shopbar .logo{margin-right:0;flex:none}
#chat-root{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#chat-root[hidden],body:not(.is-shop) #chat-root,body.modal-open #chat-root{display:none!important}
.chat-fab{width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 24px rgba(16,53,104,.28);transition:transform .15s}
.chat-fab:hover{transform:translateY(-2px)}
.chat-fab:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.chat-fab svg{width:27px;height:27px}
.chat-note{display:flex;align-items:flex-start;gap:4px;max-width:260px;background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:16px 16px 4px 16px;box-shadow:var(--shadow);padding:4px 4px 4px 12px;animation:noteIn .25s ease-out}
.chat-note[hidden]{display:none}
.chat-note-txt{border:0;background:none;text-align:left;font:inherit;font-size:14px;line-height:1.4;color:inherit;padding:8px 0;cursor:pointer}
.chat-note-x{border:0;background:none;color:var(--muted);width:30px;height:30px;display:grid;place-items:center;border-radius:50%;cursor:pointer;flex:none}
.chat-note-x svg{width:14px;height:14px}
@keyframes noteIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chat-panel{width:min(390px,calc(100vw - 32px));height:min(600px,calc(100vh - 130px));background:var(--bg);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line);background:var(--raised)}
.chat-head .mark.av{width:44px;height:26px}
.chat-head div{flex:1;display:flex;flex-direction:column}
.chat-head b{font-size:15px}
.chat-head span{font-size:12px;color:var(--muted)}
.chat-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.cmsg{max-width:86%;padding:9px 12px;border-radius:16px;font-size:14.5px;line-height:1.45;overflow-wrap:anywhere}
.cmsg p+p,.cmsg p+ul,.cmsg ul+p{margin-top:6px}
.cmsg ul{margin:4px 0 0 18px;padding:0}
.cmsg.bot{align-self:flex-start;background:var(--surface);color:var(--ink);border-bottom-left-radius:4px}
.cmsg.me{align-self:flex-end;background:var(--logo-navy,#103568);color:#fff;border-bottom-right-radius:4px}
.cmsg.note{background:var(--warn-soft);color:var(--ink)}
.chat-prod{font-weight:700;color:var(--logo-navy,#103568);text-decoration:underline;text-underline-offset:2px}
:root[data-shop-theme="dark"] .chat-prod{color:var(--accent-strong)}
:root[data-shop-theme="dark"] .cmsg.me{background:var(--accent);color:var(--on-accent)}
.typing{display:flex;gap:4px;padding:13px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.3;transform:none}40%{opacity:1;transform:translateY(-3px)}}
.chat-quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.chat-quick .chip{font-size:13px;padding:7px 12px}
.chat-msgr{display:flex;align-items:center;justify-content:center;gap:6px;margin:0 14px 8px;padding:8px;border:1px solid var(--line);border-radius:12px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none}
.chat-msgr svg{width:16px;height:16px}
.chat-form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.chat-form .input{flex:1;min-width:0;border-radius:999px;font-size:16px}
.chat-send{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer}
.chat-send:disabled{opacity:.5}
.chat-send svg{width:20px;height:20px}
.chat-foot{font-size:11px;color:var(--muted);padding:0 14px 10px;line-height:1.35}
@media (max-width:780px){
  body.is-shop #chat-root{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  body.is-product #chat-root{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  body.chat-open{overflow:hidden}
  body.chat-open #chat-root{inset:0;right:0;bottom:0;z-index:60}
  body.chat-open .chat-fab{display:none}
  .chat-panel{position:fixed;inset:0;width:auto;height:auto;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .chat-head{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){.chat-note,.typing i{animation:none}.chat-fab{transition:none}}
.balcard{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;background:var(--raised)}
.baltotal{display:flex;flex-direction:column;gap:2px;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface)}
.baltotal span:first-child{font-size:12px;color:var(--muted)}
.baltotal b{font-family:var(--f-display);font-size:26px}
.balreq{display:grid;gap:6px;margin-top:12px;padding:12px 14px;border:1px dashed var(--line);border-radius:12px}
.bal-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.bal-top b{display:block}
.bal-amt{display:flex;flex-direction:column;margin:12px 0 8px}
.bal-amt span{font-size:12px;color:var(--muted)}
.bal-amt b{font-family:var(--f-display);font-size:30px;line-height:1.15}
.balnext{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--accent-soft)}
.balnext span:first-child{font-size:12px;font-weight:600}
.balnext b{grid-row:span 2;font-size:20px;font-family:var(--f-display)}
.balnext span:last-child{font-size:13px;color:var(--muted)}
.balnext.bad{background:var(--bad-soft,#FDECEC)} .balnext.bad span:first-child{color:var(--bad)}
.balnext.ok{background:var(--ok-soft)}
.balsched{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.balsched summary{cursor:pointer;font-weight:600}
.balsched table{width:100%;margin-top:8px;font-size:13px}
.balsched th,.balsched td{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)}
.balsched .r{text-align:right}
.agreement{background:#fff;color:#14234B;border:1px solid var(--line);border-radius:14px;padding:22px;font-size:13px;line-height:1.5}
:root .agreement .wm{color:#103568;font-size:20px}
.agreement .wm .v{color:#F7801E}
.ag-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:2px solid #F7801E;padding-bottom:12px;margin-bottom:10px}
.ag-top .flock{display:flex;align-items:center;gap:8px}
.ag-top .mark.av{width:52px;height:30px}
.ag-ref{display:flex;flex-direction:column;text-align:right;font-size:12px;color:#4A5675}
.ag-ref b{font-size:16px;color:#14234B}
.ag-small{font-size:12px;color:#4A5675;margin:8px 0}
.ag-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.ag-cols{grid-template-columns:1fr}.agreement{padding:14px}}
.agreement table{width:100%;border-collapse:collapse;margin:10px 0;font-variant-numeric:tabular-nums}
.agreement caption{text-align:left;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#4A5675;padding-bottom:4px}
.ag-t th{text-align:left;font-weight:600;color:#4A5675;width:42%;padding:5px 8px 5px 0;border-bottom:1px solid #E3E8F0;vertical-align:top}
.ag-t td{padding:5px 0;border-bottom:1px solid #E3E8F0}
.ag-note{display:block;font-size:11px;color:#6B7590}
.ag-sched th,.ag-sched td{padding:4px 6px;border-bottom:1px solid #E3E8F0;text-align:left}
.ag-sched .r{text-align:right}
.ag-sched thead th{background:#EEF2F7;font-size:12px}
.ag-sched tfoot td{font-weight:700;border-bottom:0}
.ag-terms ol{margin:6px 0 0 18px;padding:0}
.ag-terms li{margin-bottom:4px}
.ag-sign{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:34px}
.ag-sign div{display:flex;flex-direction:column;font-size:12px;color:#4A5675}
.ag-sign b{color:#14234B;font-size:13px}
.ag-line{border-bottom:1px solid #14234B;height:36px;margin-bottom:6px}
@media print{
  @page{margin:14mm}
  body{overflow:visible!important;background:#fff!important}
  #app,#toast{display:none!important}
  #modal-root .overlay{position:static;background:none;padding:0;overflow:visible;display:block}
  #modal-root .modal{box-shadow:none;max-width:none;border-radius:0;background:#fff;animation:none}
  #modal-root .m-body{padding:0}
  .no-print{display:none!important}
  .agreement{border:0;padding:0;font-size:12px}
  .ag-sched tr{break-inside:avoid}
}
.mbody{padding:14px 16px;display:grid;gap:14px}
.mrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.mcollect .mrow:first-child b{font-size:20px;font-family:var(--f-display)}
.mstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.mstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mstat{background:var(--surface);border-radius:12px;padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:2px}
.mstat span{font-size:12px;color:var(--muted)}
.mstat b{font-size:18px}
.mstat small{font-size:12px;color:var(--muted)}
.mstat.ok b{color:var(--ok)} .mstat.warn b{color:var(--warn)}
.mbills{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px}
.ptools{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.psearch{max-width:520px;flex:none}
.topsearch{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px}
.topsearch:focus-within{border-color:var(--accent);background:var(--bg)}
.topsearch input{border:0;outline:0;background:transparent;width:100%;min-width:0;font-size:15px}
.topsearch svg{width:17px;height:17px;color:var(--muted);flex:none}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:40px;height:40px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;font-weight:600;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.msgr{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
@media (max-width:560px){
  .shopbar .wrap{flex-wrap:wrap;row-gap:8px}
  .shopbar .logo{margin-right:auto}
  .shopbar .topsearch{order:5;flex-basis:100%}
  .shopbar .tagline{display:none}
}
main#home{padding-bottom:12px}
.banners{padding-block:14px 4px}
.btrack{display:grid;grid-auto-flow:column;grid-auto-columns:100%;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:18px;scrollbar-width:none}
.btrack::-webkit-scrollbar{display:none}
.banner{scroll-snap-align:start;border:0;margin:0;min-height:132px;border-radius:18px;padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;cursor:pointer;color:var(--ink);position:relative;overflow:hidden;font:inherit}
.banner.tone-a{background:var(--tone-a)}.banner.tone-b{background:var(--tone-b)}.banner.tone-c{background:var(--tone-c)}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.btext{display:grid;gap:4px;min-width:0}
.btext b{font-family:var(--f-display);font-size:clamp(19px,3.2vw,26px);line-height:1.15;text-wrap:balance}
.btext span{color:var(--muted);font-size:14px;max-width:46ch}
.bicon{flex:none;width:58px;height:58px;border-radius:50%;background:var(--bicon);display:grid;place-items:center;color:var(--accent-strong);font-size:24px}
.bicon svg{width:30px;height:30px}
.banner.preview{min-height:96px;cursor:default}
.bdots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.bdots span{width:6px;height:6px;border-radius:99px;background:var(--line);transition:width .2s,background .2s}
.bdots span.on{width:18px;background:var(--accent)}
.cats{padding-block:10px 0}
.caticons{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px;background:var(--bg);border-radius:18px;padding:12px 8px}
@media (max-width:780px){.caticons{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:76px;overflow-x:auto;scrollbar-width:none;padding:12px 6px;mask-image:linear-gradient(90deg,#000 85%,transparent)}.caticons::-webkit-scrollbar{display:none}}

/* ===== Palette v2: logo navy for brand moments, clearer layers, orange only for actions and prices ===== */
:root{
  --brand:#103568; --brand-tint:#E6ECF5; --brand-ink:#103568;
  --page:#EEF2F7; --line:#DCE3EE; --surface:#F1F4F9;
  --accent-strong:#B3550A; --price-box:#EAF0F9;
  --banner-deep:#103568; --banner-deep-sub:#C9D6F2;
}
:root[data-shop-theme="dark"]{
  --brand:#8DB0F2; --brand-tint:#1D2B5C; --brand-ink:#C9D6F2;
  --page:#0A1230; --bg:#15204A; --raised:#1A2654; --surface:#1D2B5C; --line:#2A3A6E;
  --accent-soft:#24305F; --accent-strong:#FF9B47; --price-box:#1D2B5C;
  --tone-a:#1D2B5C; --tone-b:#1A2755; --tone-c:#163028;
  --banner-deep:#1A3A78; --banner-deep-sub:#C9D6F2;
}
a{color:var(--brand)}
.caticon .ci{background:var(--brand-tint);color:var(--brand-ink)}
.caticon[aria-pressed="true"] .ci{background:var(--brand-tint);color:var(--brand-ink);box-shadow:inset 0 0 0 2px var(--brand)}
.banner.tone-a{background:var(--banner-deep);color:#fff}
.banner.tone-a .btext span{color:var(--banner-deep-sub)}
.banner.tone-a .bicon{background:rgba(255,255,255,.12);color:#FFB21A}
.pricebox{background:var(--price-box)}
.pimg,.gslide,.thumb{background:var(--surface)}
.tag.ghost{background:var(--surface)}
:root[data-shop-theme="dark"] .protobar{background:#1D2B5C}
:root[data-shop-theme="dark"] .mo[aria-checked="true"]{background:#24305F}

/* Messenger as an icon on phones */
@media (max-width:560px){ .shopbar .iconbtn.msgr .hide-sm{display:none} }
/* Trust strip */
.trust{padding-block:12px 0}
.trust ul{list-style:none;margin:0;padding:12px 14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;background:var(--bg);border-radius:18px;border:1px solid var(--line)}
.trust li{display:flex;gap:10px;align-items:center;font-size:13.5px;font-weight:600;line-height:1.3;min-width:0}
.trust svg{width:24px;height:24px;flex:none;color:var(--brand)}
@media (max-width:780px){ .trust ul{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px} .trust li{font-size:12.5px} .trust svg{width:22px;height:22px} }
/* FAQ */
.faq h2{font-size:20px;margin-bottom:12px}
.faq details{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 16px;margin-bottom:8px;max-width:820px}
.faq summary{cursor:pointer;font-weight:700;padding:14px 0;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--brand);font-size:22px;line-height:1;flex:none}
.faq details[open] summary::after{content:"\2013"}
.faq details p{color:var(--muted);padding-bottom:14px;max-width:70ch}
/* Footer details */
.finfo{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;margin-top:4px}
.finfo a{color:var(--ink);font-weight:600}
.flinks{display:flex;gap:16px;flex-wrap:wrap}
/* Privacy */
.privacy-text h3{font-size:15px;margin:14px 0 4px;font-family:var(--f-body);font-weight:700}
.privacy-text p,.privacy-text li{font-size:14px;color:var(--muted)}
.privacy-text ul{padding-left:18px;margin:4px 0}
.consent{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}

.pv-inline .privacy-text{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 12px 10px;margin-top:6px}

/* Owner pages use the full screen width */
.wrap.wide{max-width:1560px}
.owner{grid-template-columns:190px minmax(0,1fr);gap:24px}

.how3{padding-block:12px 0}

@media (max-width:560px){ .how3 li{flex-direction:column;align-items:flex-start;font-size:12.5px} }
/* v4: owner tables compact on laptops, cards on phones */
.otable td,.otable th{padding:10px 12px}
.otable th.stick,.otable td.stick{position:sticky;right:0;background:var(--raised);box-shadow:-8px 0 12px -10px rgba(16,53,104,.35)}
.otable thead th.stick{background:var(--surface)}
.ocards{display:none;gap:10px}
.ocard{display:grid;gap:8px;background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:12px 14px}

.ocard .oc-item{display:inline}

@media (max-width:560px){ .tile .t-val{font-size:20px;white-space:nowrap;overflow-wrap:normal} .tile{padding:12px 14px} }

.ed-sec{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:0 16px;margin-bottom:14px}
.ed-sec>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;flex-wrap:wrap}
.ed-sec>summary::-webkit-details-marker{display:none}
.ed-sec>summary h3{font-size:17px;display:flex;gap:10px;align-items:center}
.ed-sec>summary::after{content:"Edit";font-size:13px;font-weight:700;color:var(--brand);margin-left:auto}
.ed-sec[open]>summary::after{content:"Close"}
.ed-sec[open]{padding-bottom:14px}
.ed-sec .rem{background:var(--bg)}
.gtk-grid{grid-template-columns:minmax(0,1fr) 160px 200px auto;align-items:end}
.faq-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) auto;align-items:start}

.okline{font-size:13px;color:var(--ok)} .warnline{font-size:13px;color:var(--warn)}

function submitReview(form){
  const f = Object.fromEntries(new FormData(form)), name=(f.name||'').trim(), text=(f.text||'').trim();
  if (!M.rating){ M.err='errRate'; renderModal(); return; }
  if (!name || text.length<10){ M.err='errRev'; renderModal(); return; }
  if (!f.ok){ M.err='errRevOk'; renderModal(); return; }

const last10 = v => String(v||'').replace(/\D/g,'').slice(-10);
function localBalance(phone){
  const mine = x => last10(x)===phone;
  const quotes = S.quotes.filter(q=>mine(q.contact)), accts = S.accounts.filter(a=>mine(a.customer.contact) && !a.cancelled);
  if (!quotes.length && !accts.length) return { ok:false, error:'errBalNone' };
  const view = a => { const sched = a.schedule.map(it=>({ n:it.n, due:it.due, amount:it.amount, paid:r2(it.paid), status:instStatus(it) })), nx = sched.find(i=>i.status!=='Paid');

  const all = accts.map(view), open = all.filter(a=>a.status!=='Fully Paid');
  const who = (accts[0]&&accts[0].customer.name) || (quotes[0]&&quotes[0].name) || '';
  return { ok:true, firstName: who.trim().split(/\s+/)[0]||'', accounts:open, fullyPaid: all.length-open.length,
    requests: quotes.filter(q=>q.status==='Pending Review').map(q=>({ ref:q.id, item:q.productName, months:q.months||0, status:q.status })) };
}
async function submitBalance(form){
  if (M.sending) return;

}

/* ---------- This month: money in and card bills ---------- */
// Customer payments due this month vs collected, service charges received, and card bills to plan for.
function monthStats(ym){
  const live = S.accounts.filter(a=>!a.cancelled);
  const due = live.flatMap(a=>a.schedule.filter(it=>it.due.slice(0,7)===ym).map(it=>({a,it})));
  const expected = r2(due.reduce((s,x)=>s+x.it.amount,0)), paidOnDue = r2(due.reduce((s,x)=>s+Math.min(x.it.paid,x.it.amount),0));
  const pays = S.accounts.flatMap(a=>a.schedule.flatMap(it=>(it.payments||[]).filter(p=>(p.date||'').slice(0,7)===ym).map(p=>({it,p}))));
  const received = r2(pays.reduce((s,x)=>s+(+x.p.amount||0),0));
  const scIn = live.filter(a=>a.dpPaid && (a.dpPaidDate||'').slice(0,7)===ym), scWait = live.filter(a=>!a.dpPaid);
  const bought = live.filter(a=>(a.startDate||'').slice(0,7)===ym);
  return { due, expected, paidOnDue, left:r2(expected-paidOnDue), received, other:r2(Math.max(0,received-paidOnDue)),
    overdue: due.filter(x=>instStatus(x.it)==='Overdue').length,
    scIn: r2(scIn.reduce((s,a)=>s+(+a.dp||0),0)), scInN: scIn.length, scWait: r2(scWait.reduce((s,a)=>s+(+a.dp||0),0)), scWaitN: scWait.length,
    bought: r2(bought.reduce((s,a)=>s+a.price,0)), boughtN: bought.length };
}

const IMPORT_COLS = {
  name:['name','product','product name','item','item name','model','gadget','gadget name'],
  brand:['brand','make','manufacturer'],
  category:['category','type','product type'],
  price:['price','item price','cash price','amount','srp','cost','cash','unit price','gadget price'],
  dp:['dp','upfront','upfront dp','upfront payment','down payment','downpayment','service charge','service fee','charge','fee'],
  terms:['terms','months','durations','duration','installment','installment months','term','available terms'],
  status:['status','availability','stock'],
  description:['description','details','specs','specifications'],
  imageUrl:['image','image url','photo','picture','photo url'],
  sourceUrl:['source','source url','link','url','product link','store link'],
};
const TEMPLATE_CSV = `Product Name,Brand,Category,Item Price,Service Charge,Terms,Status
Galaxy A56 5G 8GB/256GB,Samsung,Smartphones,23990,3500,"3,6,9,12",Available
Redmi Note 14 Pro 8GB/256GB,Xiaomi,Smartphones,15999,15%,"3,6,12",Available
55in 4K Google TV,TCL,TVs,26990,4000,"6,12,18",Limited stock`;
const normHead = h => String(h).toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
const money = v => { if (typeof v==='number') return v; const n = parseFloat(String(v).replace(/[^0-9.]/g,'')); return isNaN(n)?NaN:n; };
function matchCat(v){
  const t = String(v||'').toLowerCase(); if(!t) return '';
  const exact = CATS.find(c=>c.toLowerCase()===t); if (exact) return exact;
  if (/phone|cellphone|mobile/.test(t)) return 'Smartphones';
  if (/laptop|notebook|macbook|computer|pc/.test(t)) return 'Laptops';
  if (/tablet|ipad|tab/.test(t)) return 'Tablets';
  if (/\btv\b|television/.test(t)) return 'TVs';
  if (/applian|aircon|ref|fridge|wash|fan|oven|cooker/.test(t)) return 'Appliances';
  if (/grocer|rice|sack|bigas|canned|noodle|coffee|milk|sugar|oil|food|pack|bundle/.test(t)) return 'Groceries';
  if (/furnit|sofa|bed|table|chair|cabinet|mattress/.test(t)) return 'Furniture';
  return 'Other Products';
}
function matchStatus(v){ const t=String(v||'').toLowerCase(); if(/out|sold|none|unavail/.test(t)) return 'Out of stock'; if(/limit|few|low/.test(t)) return 'Limited stock'; return t?'Available':''; }
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  for (let i=0;i<text.length;i++){ const c=text[i];
    if (q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if (c==='"') q=true; else if (c===','){ row.push(cur); cur=''; }
    else if (c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=c; }
  if (cur||row.length){ row.push(cur); rows.push(row); }
  const head = rows.shift()||[];
  return rows.filter(r=>r.some(x=>String(x).trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]??''])));
}
// The Excel reader (about 900 KB) loads only when the owner imports a file, so the shop stays fast on mobile data.
const loadXLSX = () => window._xl || (window._xl = new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=res; s.onerror=()=>{ window._xl=null; s.remove(); rej(); }; document.head.appendChild(s); }));
function readImportFile(file){
  const isCSV = /\.csv$|\.txt$/i.test(file.name);
  if (!isCSV && !window.XLSX){ loadXLSX().then(()=>readImportFile(file), ()=>{ M.err='The Excel reader could not load. Check your connection, or save the sheet as CSV and upload that.'; renderModal(); }); return; }
  const fr = new FileReader();
  fr.onerror = () => { M.err='That file could not be read. Try saving it again as .xlsx or .csv.'; renderModal(); };
  fr.onload = () => {
    try{
      let raw;
      if (window.XLSX){ const wb = XLSX.read(isCSV ? fr.result : new Uint8Array(fr.result), {type: isCSV?'string':'array'}); raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:'', raw:false}); }
      else if (isCSV) raw = parseCSV(fr.result);
      else { M.err='The Excel reader did not load. Save the sheet as CSV and upload that instead.'; renderModal(); return; }
      if (!raw.length){ M.err='No rows found. Make sure the first row has column names and the products start on row 2.'; renderModal(); return; }
      M.raw = raw; M.fileName = file.name; M.err=''; renderModal();
    }catch(e){ M.err='That file could not be read. Try saving it again as .xlsx or .csv.'; renderModal(); }
  };
  isCSV ? fr.readAsText(file) : fr.readAsArrayBuffer(file);
}
function mapImportRows(){
  const raw = M.raw||[]; if(!raw.length) return {rows:[], cols:{}};
  const cols = {}; Object.keys(raw[0]).forEach(h=>{ const n=normHead(h); for (const [k,al] of Object.entries(IMPORT_COLS)) if (!cols[k] && al.includes(n)) cols[k]=h; });
  const existing = new Map(S.products.map(p=>[(p.brand+' '+p.name).toLowerCase().trim(), p]));
  const rows = raw.map((r,i)=>{
    const g = k => cols[k]!==undefined ? String(r[cols[k]]??'').trim() : '';
    const out = { line:i+2, name:g('name'), brand:g('brand'), errors:[] };
    const price = money(cols.price!==undefined ? r[cols.price] : '');
    if (!out.name) out.errors.push('No product name');
    if (!(price>0)) out.errors.push('Missing or invalid price');
    out.price = r2(price);
    const dpRaw = g('dp');
    if (dpRaw){ const n = money(dpRaw); if (isNaN(n)) out.errors.push('Service charge is not a number'); else if (/%/.test(dpRaw)){ out.dpType='percent'; out.dpValue=n; } else { out.dpType='fixed'; out.dpValue=n; } }
    const terms = (g('terms').match(/\d+/g)||[]).map(Number).filter(n=>DURATIONS.includes(n));
    if (terms.length) out.durations=[...new Set(terms)].sort((a,b)=>a-b);
    const cat = matchCat(g('category')); if (cat) out.category=cat;
    const st = matchStatus(g('status')); if (st) out.status=st;
    ['description','imageUrl','sourceUrl'].forEach(k=>{ const v=g(k); if(v) out[k]=v; });
    out.match = existing.get((out.brand+' '+out.name).toLowerCase().trim()) || null;
    return out;
  });
  return {rows, cols};
}

function applyImport(){
  const {rows} = mapImportRows(), ok = rows.filter(r=>!r.errors.length), d = M.def;
  if (!d.durations.length){ M.err='Pick at least one default term.'; renderModal(); return; }
  if (M.mode==='replace' && !M.confirm){ M.confirm=true; renderModal(); return; }
  const build = r => ({ id:uid('p'), name:r.name, brand:r.brand, category:r.category||'Other Products', price:r.price,
    dpType:r.dpType||d.dpType, dpValue:r.dpType?r.dpValue:+d.dpValue, durations:r.durations||[...d.durations],
    status:r.status||'Available', description:r.description||'', imageUrl:r.imageUrl||'', sourceUrl:r.sourceUrl||'', sample:false });
  let added=0, updated=0;
  if (M.mode==='replace'){ S.products = ok.map(build); added = ok.length; }
  else ok.forEach(r=>{
    if (r.match){ const p=r.match; p.price=r.price; ['brand','category','status','description','imageUrl','sourceUrl','durations'].forEach(k=>{ if(r[k]!==undefined && r[k]!=='') p[k]=r[k]; }); if(r.dpType){ p.dpType=r.dpType; p.dpValue=r.dpValue; } p.sample=false; updated++; }
    else { S.products.push(build(r)); added++; }
  });
  save(); closeModal(); render();
  toast(`${added} added${updated?`, ${updated} updated`:''}`);
}

  return out;

function apSummary(price, sc, months){
  if (!(price>0)) return `<div><span>Enter the price to see the monthly amount</span><b></b></div>`;
  const pl = plan(price, months);
  return `<div><span>${months===1?'Due after 1 month':'Monthly installment'}</span><b>${peso(pl.monthly)}${months===1?'':' × '+months}${pl.last!==pl.monthly?` (last ${peso(pl.last)})`:''}</b></div><div><span>Total payment</span><b>${peso(r2((+sc||0)+price))}</b></div>`;

function submitApprove(form){
  const f = Object.fromEntries(new FormData(form)), q = S.quotes.find(x=>x.id===M.id);
  const price0 = q.custom ? r2(+f.price) : q.price; if (q.custom) M.apPrice = price0;
  if (approvalFlags(q, price0).length && !f.override){ M.err='Please read the warning above and tick the box if you still want to approve.'; renderModal(); return; }
  if (q.custom){
    const price = r2(+f.price), sc = f.sc===''?NaN:r2(+f.sc), months = +f.months;
    if (!(price>0)){ M.err='Enter the item price you agreed with the customer.'; renderModal(); return; }
    if (!(sc>=0)){ M.err='Enter the service charge (0 is allowed).'; renderModal(); return; }
    const pl = plan(price, months);
    Object.assign(q, { price, dp:sc, months, monthly:pl.monthly, last:pl.last, total:r2(sc+price) });
  }
  if (!f.start || !f.first){ M.err='Choose both dates.'; renderModal(); return; }
  if (f.first < f.start){ M.err='The first due date should be on or after the start date.'; renderModal(); return; }
  if (!q.custom){ const pl = plan(q.price, q.months); Object.assign(q, { monthly:pl.monthly, last:pl.last }); }
  const a = createAccount(q, f.start, f.first, !!f.dpPaid, f.cardId);
  toast('Account created'); M = {kind:'account', id:a.id}; renderModal(); render();
}

function compressImage(file, max=900, q=0.78){
  return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=rej; fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q)); }; img.onerror=rej; img.src=fr.result; }; fr.readAsDataURL(file); });
}

function nextDayDate(day){ const T=today(), t=parse(T); const thisM = addMonthsDay(iso(new Date(t.getFullYear(),t.getMonth(),1)),0,day); return thisM >= T ? thisM : addMonthsDay(thisM,1,day); }
function cardStats(c){
  const accts = S.accounts.filter(a=>a.cardId===c.id && !a.cancelled), ym = today().slice(0,7);

function submitCard(form){
  const f = Object.fromEntries(new FormData(form)), last4=(f.last4||'').replace(/\D/g,'');

  if (!f.name.trim()){ M.err='Give the card a nickname.'; renderModal(); return; }
  if (last4.length!==4){ M.err='Enter exactly the last 4 digits of the card.'; renderModal(); return; }
  const data = { name:f.name.trim(), last4, limit: f.limit===''?'':Math.max(0,+f.limit), stmtDay:day(f.stmtDay), dueDay:day(f.dueDay) };

// One customer = one contact number. Every quote and account with that number is grouped under them.
function ckey(c){ let d=(c||'').replace(/\D/g,''); if (d.startsWith('63') && d.length===12) d='0'+d.slice(2); return d; }
function customers(){
  const map = new Map();
  const touch = (k,info,ts) => {
    if (!map.has(k)) map.set(k,{key:k,name:info.name,contact:info.contact,email:info.email||'',messenger:info.messenger||'',quotes:[],accounts:[],sample:!!info.sample,ts:-1});
    const c = map.get(k); if (ts>=c.ts){ c.name=info.name; c.contact=info.contact; c.ts=ts; } if (info.messenger && !c.messenger) c.messenger=info.messenger; if (info.email && (ts>=c.ts || !c.email)) c.email=info.email; return c;
  };
  S.quotes.forEach(q=>touch(ckey(q.contact),q,q.createdAt).quotes.push(q));
  S.accounts.forEach(a=>touch(ckey(a.customer.contact),{...a.customer,sample:a.sample},0).accounts.push(a));
  return map;
}
function custStats(c){
  const live = c.accounts.filter(a=>!a.cancelled);
  const inst = live.flatMap(a=>a.schedule.map(it=>({a,it,st:instStatus(it)})));
  const open = inst.filter(x=>x.st!=='Paid').sort((x,y)=>x.it.due.localeCompare(y.it.due));
  const paidInst = inst.filter(x=>x.st==='Paid'), late = paidInst.filter(x=>x.it.paidDate > x.it.due).length;
  return { live, outstanding:r2(live.reduce((s,a)=>s+acctBalance(a),0)), paid:r2(live.reduce((s,a)=>s+acctPaid(a),0)),
    dp:r2(c.accounts.filter(a=>a.dpPaid).reduce((s,a)=>s+a.dp,0)), overdue:inst.filter(x=>x.st==='Overdue').length,
    next:open[0]||null, late, onTime:paidInst.length-late, activeCount:live.filter(a=>acctStatus(a)!=='Fully Paid').length };
}

  if (st.overdue) return `<span class="pill bad">${st.overdue} overdue</span>`;

  return `<span class="pill">No payments yet</span>`;
}

/* ---------- Create an account (from a quote, or added by the owner) ---------- */
function createAccount(q, start, first, dpPaid, cardId){
  const a = { id:uid('A-'), quoteId:q.id, customer:{name:q.name,contact:q.contact,email:q.email||'',messenger:q.messenger}, productId:q.productId, productName:q.productName, price:q.price, dp:q.dp, dpPaid:!!dpPaid, dpPaidDate:dpPaid?today():'', months:q.months, monthly:plan(q.price,q.months).monthly, startDate:start, firstDue:first, dueDay:parse(first).getDate(), schedule:buildSchedule(q.price,q.months,first).map(it=>({...it,payments:[]})), cardId:cardId||'', cancelled:false, sample:false };
  S.accounts.unshift(a); q.status='Approved'; q.accountId=a.id; save(); return a;
}
function defaultTerm(p){ return p.durations.includes(12) ? 12 : p.durations[Math.floor((p.durations.length-1)/2)]; }

function submitNewPurchase(form){
  const f = Object.fromEntries(new FormData(form));
  const name=(f.name||'').trim(), contact=(f.contact||'').trim(), p=S.products.find(x=>x.id===f.pid), months=+f.months;
  let err='';
  if (!name || !contact) err='Enter the customer name and contact number.';
  else if (contact.replace(/\D/g,'').length<10) err='Enter a valid mobile number, for example 0917 123 4567.';
  else if ((f.email||'').trim() && !validEmail((f.email||'').trim())) err='Check the email address, or leave it blank.';
  else if (!p || !p.durations.includes(months)) err='Choose a product and term.';
  else if (!f.start || !f.first) err='Choose both dates.';
  else if (f.first < f.start) err='The first due date should be on or after the start date.';
  if (err){ M.err=err; renderModal(); return; }
  const o = quoteFor(p, months);
  const q = { id: API_URL ? 'MA-'+Date.now().toString(36).toUpperCase() : 'MQ-'+(S.nextQuote++), createdAt:Date.now(), name, contact, email:(f.email||'').trim(), messenger:(f.messenger||'').trim(), productId:p.id, productName:fullName(p), price:p.price, ...o, message:'Added by owner', status:'Approved', sample:false };
  S.quotes.unshift(q);
  const a = createAccount(q, f.start, f.first, !!f.dpPaid, f.cardId);
  toast('Purchase added'); M = {kind:'account', id:a.id, fromCust:ckey(contact)}; renderModal(); render();
}

function submitPay(form){

/* ---------- Edit account: details, due dates, reminder preferences ---------- */
const CHANNELS = ['Messenger','SMS / Text','Phone call','Email'];
function remOf(a){ return { on:true, daysBefore:null, channel:'Messenger', message:'', snoozeUntil:'', ...(a.reminder||{}) }; }
function remSummary(a){
  const r = remOf(a);
  if (!r.on) return 'Reminders paused';
  const bits = [`${r.daysBefore ?? S.settings.dueSoonDays} days before`, r.channel];
  if (r.snoozeUntil && r.snoozeUntil > today()) bits.push('snoozed until '+fdate(r.snoozeUntil));
  if (r.message) bits.push('custom message');
  return 'Reminders on · '+bits.join(' · ');
}
// New due dates: installment k gets `date`; later unpaid ones follow monthly on the same day when `follow` is set.
function shiftedDates(a, k, date, follow){
  const day = parse(date).getDate();
  return a.schedule.map((it,i)=>{
    if (i < k || instStatus(it)==='Paid') return it.due;
    if (i === k) return date;
    return follow ? addMonthsDay(date, i-k, day) : it.due;
  });
}
function duePreviewHTML(a, k, date, follow){
  if (!date) return '';
  const nd = shiftedDates(a, k, date, follow);
  const rows = a.schedule.map((it,i)=>({it,old:it.due,neu:nd[i]})).filter(x=>x.old!==x.neu);
  if (!rows.length) return `<p class="small muted">No changes yet.</p>`;
  return `<div class="tablewrap" style="max-height:220px;overflow:auto"><table><thead><tr><th>#</th><th>Current</th><th>New due date</th></tr></thead>
    <tbody>${rows.map(x=>`<tr><td class="num">${x.it.n}</td><td class="num muted">${fdate(x.old)}</td><td class="num"><b>${fdate(x.neu)}</b></td></tr>`).join('')}</tbody></table></div>`;
}

function submitEditAcct(form){
  const f = Object.fromEntries(new FormData(form)), a = S.accounts.find(x=>x.id===M.id);
  const name=(f.name||'').trim(), contact=(f.contact||'').trim();
  if (!name || contact.replace(/\D/g,'').length<10){ M.err='Enter the customer name and a valid contact number.'; renderModal(); return; }
  const days = f.daysBefore==='' ? null : Math.max(0, Math.min(31, Math.round(+f.daysBefore)));
  if (f.k!==undefined){
    const k=+f.k;
    if (!f.date){ M.err='Choose the new due date.'; renderModal(); return; }
    if (k>0 && f.date <= a.schedule[k-1].due){ M.err=`The new date must be after installment #${k} (${fdate(a.schedule[k-1].due)}).`; renderModal(); return; }
    const nd = shiftedDates(a, k, f.date, !!f.follow);
    a.schedule.forEach((it,i)=>{ if (it.due!==nd[i]){ it.due=nd[i]; it.reminded=''; } });
    if (f.follow) a.dueDay = parse(f.date).getDate();
    a.firstDue = a.schedule[0].due;
  }
  const email = (f.email||'').trim(); if (email && !validEmail(email)){ M.err='Check the email address, or leave it blank.'; renderModal(); return; }
  a.customer = { name, contact, email, messenger:(f.messenger||'').trim() };
  a.cardId = f.cardId||'';
  a.reminder = { on:!!f.remOn, daysBefore:days, channel:f.channel, message:(f.message||'').trim(), snoozeUntil:f.snoozeUntil||'' };
  save(); toast('Account updated');
  M = {kind:'account', id:a.id, fromCust:ckey(contact)}; renderModal(); render();
}

}
function emailedLine(a,it){

function ownerReminders(){
  const T = today();

  const groups = [
    ['Overdue','bad', active.filter(x=>x.d<0)],
    ['Due today','warn', active.filter(x=>x.d===0)],
    ['Due soon','info', active.filter(x=>x.d>0 && x.d<=win(x))],

      <div class="msg">${esc(txt)}</div>
      <div class="acts">
        <button class="btn sm primary" data-act="copy-rem" data-a="${a.id}" data-n="${it.n}">Copy message</button>
        ${r.channel==='Messenger' && ml ? `<a class="btn sm" href="${esc(ml)}" target="_blank" rel="noopener">${I.msgr}<span>Open their Messenger</span></a>` : ''}
        ${r.channel==='SMS / Text' || r.channel==='Phone call' || (r.channel==='Messenger' && !ml) ? `<button class="btn sm" data-act="copy-text" data-text="${esc(a.customer.contact)}">Copy number</button>` : ''}
        ${r.channel==='Email' ? `<button class="btn sm" disabled title="Connect an email service to enable">Send email</button>` : ''}
        <button class="btn sm ghost" data-act="mark-rem" data-a="${a.id}" data-n="${it.n}">${it.reminded?'Reminded '+fdate(it.reminded):'Mark as reminded'}</button>

        <button class="btn sm ghost" data-act="pay" data-a="${a.id}" data-n="${it.n}" data-ext="1">Record payment</button>

  const uniq = list => [...new Map(list.map(x=>[x.a.id,x])).values()];
  return `<div class="o-head"><div><h2>Reminders</h2><p class="muted small">Copy a friendly message and send it through each customer's preferred channel.</p></div></div>
  ${reminderCallout()}
  ${groups.map(([title,cls,items])=>`<div class="rem-group"><h3>${title} <span class="pill ${cls} plain">${items.length}</span></h3>
    ${items.length?items.sort((x,y)=>x.it.due.localeCompare(y.it.due)).map(card).join(''):`<p class="muted small" style="padding:4px 0 8px">None right now.</p>`}</div>`).join('')}

/* ============================================================
   GOOGLE SHEETS CONNECTION (used only when API_URL is set)
   Customers: the shop reads the catalog from the sheet and sends
   requests and reviews to it. Owner: signs in with a password; every
   change is saved to the sheet automatically, and new customer
   requests appear without losing anything being edited.
   ============================================================ */
var SY = { ready:false, loading:false, token:'', known:{}, synced:{}, dirty:false, busy:false, again:false, gen:0, err:'', savedAt:0, timer:null, loginErr:'', catOk:false, catFail:false };
const SYNC_COLLS = ['products','quotes','accounts','reviews','notes','cards','banners','gallery'];
const TOKEN_KEY = 'abotvida-owner-token', CAT_KEY = 'abotvida-catalog';
try{ SY.token = localStorage.getItem(TOKEN_KEY) || ''; }catch(e){}

async function api(payload){
  const res = payload
    ? await fetch(API_URL, { method:'POST', body: JSON.stringify(payload) })   // sent as text/plain, which Apps Script accepts without a CORS preflight
    : await fetch(API_URL + (API_URL.includes('?')?'&':'?') + 'action=catalog');
  if (!res.ok) throw new Error('net');
  return res.json();
}

/* ---------- Shop ---------- */
function applyCatalog(c){
  S.products = c.products||[]; S.banners = c.banners||[]; S.gallery = c.gallery||[]; S.reviews = c.reviews||[]; S.sold = c.sold||{};
  Object.assign(S.settings, c.settings||{});
}
const catSig = () => JSON.stringify([S.products,S.banners,S.gallery,S.reviews,S.sold,S.settings]);
async function refreshCatalog(){
  try{
    const c = await api(); if (!c || !c.ok) throw new Error('bad');
    SY.catOk = true; SY.catFail = false;
    if (SY.ready) return;                       // the owner's full data is loaded; leave it alone
    const before = catSig(); applyCatalog(c);
    try{ localStorage.setItem(CAT_KEY, JSON.stringify(c)); }catch(e){}
    if (before !== catSig() && view!=='owner' && !M){ if (document.activeElement && document.activeElement.id==='shop-search') updateCatalog(); else { const y=window.scrollY; render(); window.scrollTo(0,y); } }
  }catch(e){
    SY.catFail = true;
    if (!S.products.length && view!=='owner') updateCatalog();
  }
}
async function apiSubmit(payload){
  if (M.sending) return;
  const mine = M, btn = modalRoot.querySelector('form[data-form] [type=submit]');
  M.sending = true; if (btn){ btn.disabled = true; btn.textContent = t('sending'); }
  let r; try{ r = await api(payload); }catch(e){ r = { ok:false, error:'errNet' }; }
  if (M !== mine) return;
  M.sending = false;
  if (!r || !r.ok){ M.err = (r && LANG[ui.lang][r.error]) ? r.error : 'errNet'; renderModal(); return; }
  if (r.quote){ M.quoteRec = r.quote; M.quoteId = r.quote.id; }
  M.step = 'done'; M.err = ''; renderModal();
}

/* ---------- Owner sign-in ---------- */
const LOGIN_ERR = {
  wrongPassword:'That password is not correct.',
  locked:'Too many wrong tries. Wait 15 minutes, then try again.',
  noPassword:'No owner password is set yet. In your Google Sheet, open the AbotVida menu and choose "Set owner password".',
  net:'Could not reach Google Sheets. Check your connection and try again.',
};
function ownerGate(){
  const head = `<header class="top"><div class="wrap">
    <button class="logo" data-act="home" aria-label="${esc(S.settings.shopName)}">${logoMark()}<span class="wmwrap lname">${wordmark()}<small>Owner dashboard</small></span></button>
    <nav class="topnav">${langToggle()}<a class="btn sm" href="#">View shop</a></nav></div></header>`;
  if (SY.loading) return `${head}<main class="wrap" style="padding-block:60px"><div class="empty">Loading your shop from Google Sheets…</div></main>`;
  return `${head}<main class="wrap" style="padding-block:40px"><form class="form panel" data-form="login" style="padding:22px;max-width:420px;margin:0 auto" novalidate>
      <h2 style="font-size:22px">Owner sign in</h2>
      <p class="small muted">Enter the owner password you set in your Google Sheet.</p>
      <div class="field"><label for="lg-pw">Password</label><input class="input" type="password" id="lg-pw" name="password" autocomplete="current-password" required></div>
      ${SY.loginErr?`<p class="err" role="alert">${esc(SY.loginErr)}</p>`:''}
      <div><button class="btn primary" type="submit">Sign in</button></div>
    </form></main>`;
}
async function ownerLogin(form){
  const pw = form.elements.password.value; if (!pw) return;
  const btn = form.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Signing in…';
  let r; try{ r = await api({ action:'login', password:pw }); }catch(e){ r = { ok:false, error:'net' }; }
  if (!r.ok){ SY.loginErr = LOGIN_ERR[r.error] || LOGIN_ERR.net; render(); document.getElementById('lg-pw')?.focus(); return; }
  SY.token = r.token; try{ localStorage.setItem(TOKEN_KEY, r.token); }catch(e){}
  SY.loginErr = ''; ownerLoad();
}
function signOutLocal(msg){
  SY.token = ''; try{ localStorage.removeItem(TOKEN_KEY); }catch(e){}
  clearTimeout(SY.timer); Object.assign(SY, { ready:false, loading:false, dirty:false, busy:false, err:'', loginErr:msg||'', known:{}, synced:{} });
  S = blankState(); closeModal(); render(); refreshCatalog();
}

/* ---------- Owner data ---------- */
function syncSnapshot(s){ const o = {}; SYNC_COLLS.forEach(c=>o[c]=JSON.stringify(s[c]||[])); o.settings = JSON.stringify(s.settings||{}); return o; }
// Returns true when the data was loaded.
async function ownerLoad(quiet){
  const gen = SY.gen;
  if (!quiet){ SY.loading = true; render(); }
  let r; try{ r = await api({ action:'ownerLoad', token:SY.token }); }catch(e){ r = { ok:false, error:'net' }; }
  if (!r.ok){
    if (r.error==='auth'){ signOutLocal(SY.ready ? 'You were signed out. Please sign in again.' : ''); return false; }
    if (!quiet){ SY.loading = false; SY.loginErr = LOGIN_ERR.net; render(); }
    return false;
  }
  if (quiet && (gen !== SY.gen || SY.dirty || SY.busy)) return true;   // edits happened meanwhile; keep them
  const before = quiet ? JSON.stringify(SY.synced) : '';
  const base = blankState(), st = r.state || {};
  const next = { ...base, ...st, settings:{ ...base.settings, ...(st.settings||{}) } };
  SYNC_COLLS.forEach(c=>{ if (!Array.isArray(next[c])) next[c] = []; });
  S = next;
  SY.known = Object.fromEntries(SYNC_COLLS.map(c=>[c, S[c].map(x=>x.id)]));
  SY.synced = syncSnapshot(S);
  Object.assign(SY, { ready:true, loading:false, err:'', savedAt:Date.now() });
  if (!quiet) render();
  else if (before !== JSON.stringify(SY.synced) && !M) { const y=window.scrollY; render(); window.scrollTo(0,y); }
  else syncBadge();
  return true;
}
function syncQueue(){
  if (!SY.ready) return;
  SY.gen++; SY.dirty = true; clearTimeout(SY.timer); SY.timer = setTimeout(syncPush, 700); syncBadge();
}
async function syncPush(){
  if (!SY.ready) return;
  if (SY.busy){ SY.again = true; return; }
  clearTimeout(SY.timer);
  const snap = syncSnapshot(S), sent = {}, known = {};
  SYNC_COLLS.forEach(c=>{ known[c] = SY.known[c] || []; if (snap[c] !== SY.synced[c]) sent[c] = JSON.parse(snap[c]); });
  if (snap.settings !== SY.synced.settings) sent.settings = JSON.parse(snap.settings);
  SY.dirty = false;
  if (!Object.keys(sent).length){ syncBadge(); return; }
  SY.busy = true; syncBadge();
  let r; try{ r = await api({ action:'ownerSave', token:SY.token, state:sent, known }); }catch(e){ r = { ok:false, error:'net' }; }
  SY.busy = false;
  if (!r.ok){
    if (r.error==='auth'){ signOutLocal('You were signed out, so your last change was not saved. Sign in and make it again.'); return; }
    SY.dirty = true; SY.err = r.error==='tooBig' ? 'A photo or record is too large to save' : 'Not saved yet';
    syncBadge(); SY.timer = setTimeout(syncPush, r.error==='tooBig' ? 30000 : 8000); return;
  }
  // Photos are now in Drive: swap the uploaded data for the link.
  (r.images||[]).forEach(im=>{
    [S, sent].forEach(root=>{ const tgt = im.coll==='settings' ? root.settings : (root[im.coll]||[]).find(x=>x.id===im.id); if (tgt && String(tgt[im.field]||'').startsWith('data:')) tgt[im.field] = im.url; });
  });
  // Requests or reviews that customers sent while you were editing.
  let arrived = 0;
  Object.entries(r.added||{}).forEach(([c,list])=>list.forEach(rec=>{
    if (!S[c].some(x=>x.id===rec.id)){ S[c].push(rec); arrived++; }
    if (sent[c] && !sent[c].some(x=>x.id===rec.id)) sent[c].push(rec);
  }));
  SYNC_COLLS.forEach(c=>{
    if (sent[c]){ SY.known[c] = sent[c].map(x=>x.id); SY.synced[c] = JSON.stringify(sent[c]); }
    else if ((r.added||{})[c]){ const base = JSON.parse(SY.synced[c]||'[]'), add = r.added[c].filter(x=>!base.some(y=>y.id===x.id)); SY.synced[c] = JSON.stringify(base.concat(add)); SY.known[c] = (SY.known[c]||[]).concat(add.map(x=>x.id)); }
  });
  if (sent.settings) SY.synced.settings = JSON.stringify(sent.settings);
  const stChanged = !!r.reminderStatus && JSON.stringify(r.reminderStatus) !== JSON.stringify(S.reminderStatus);
  if (r.reminderStatus) S.reminderStatus = r.reminderStatus;
  SY.err = ''; SY.savedAt = r.savedAt || Date.now();
  if ((arrived || stChanged) && !M){ const y=window.scrollY; render(); window.scrollTo(0,y); if (arrived) toast(arrived===1?'1 new item arrived':`${arrived} new items arrived`); }
  else syncBadge();
  if (SY.again || SY.dirty || JSON.stringify(syncSnapshot(S)) !== JSON.stringify(SY.synced)){ SY.again = false; syncQueue(); }
}
function syncText(){
  if (SY.busy || SY.dirty) return SY.err ? SY.err+' · trying again…' : 'Saving…';
  return SY.savedAt ? 'All changes saved to Google Sheets · '+new Date(SY.savedAt).toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'}) : 'Connected to Google Sheets';
}
function syncBadge(){ const el = document.getElementById('syncbadge'); if (el){ el.textContent = syncText(); el.dataset.state = SY.err ? 'bad' : (SY.busy||SY.dirty) ? 'busy' : 'ok'; } }

function moveLocalData(){
  const d = localPrototypeData(); if (!d) return;
  const withSample = document.getElementById('mv-sample')?.checked, def = blankState().settings;
  let n = 0;
  SYNC_COLLS.forEach(c=>(d[c]||[]).forEach(r=>{ if (!withSample && r.sample) return; if (!S[c].some(x=>x.id===r.id)){ S[c].push(r); n++; } }));
  Object.keys(d.settings||{}).forEach(k=>{ if (k!=='shopName' && d.settings[k]!==undefined && JSON.stringify(S.settings[k])===JSON.stringify(def[k])) S.settings[k] = d.settings[k]; });

async function changeOwnerPassword(form){
  const f = Object.fromEntries(new FormData(form));
  if (String(f.next||'').length < 8){ toast('Use at least 8 characters for the new password.'); return; }
  let r; try{ r = await api({ action:'changePassword', token:SY.token, current:f.current, next:f.next }); }catch(e){ r = { ok:false, error:'net' }; }
  if (!r.ok){ toast(r.error==='wrongPassword' ? 'The current password is not correct.' : r.error==='auth' ? 'Please sign in again first.' : 'Could not reach Google Sheets.'); return; }
  SY.token = r.token; try{ localStorage.setItem(TOKEN_KEY, r.token); }catch(e){}
  form.reset(); toast('Password changed. Other devices are signed out.');
}

/* ---------- Start ---------- */
function canRefresh(){ const a = document.activeElement; return view==='owner' && SY.ready && !M && !SY.dirty && !SY.busy && !document.hidden && !(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); }
function initSync(){
  try{ const raw = localStorage.getItem(CAT_KEY); if (raw){ applyCatalog(JSON.parse(raw)); SY.catOk = true; } }catch(e){}
  refreshCatalog();
  setInterval(()=>{ if (canRefresh()) ownerLoad(true); }, 30000);
  document.addEventListener('visibilitychange', ()=>{ if (!document.hidden){ if (canRefresh()) ownerLoad(true); else if (view!=='owner' && !SY.ready) refreshCatalog(); } });
  window.addEventListener('beforeunload', e=>{ if (SY.dirty || SY.busy){ e.preventDefault(); e.returnValue = ''; } });
}

/* ============================================================
   RENDER + EVENTS
   ============================================================ */
const app = document.getElementById('app'), modalRoot = document.getElementById('modal-root');
function render(){ clearInterval(window._bt); document.body.classList.toggle('is-shop', view!=='owner'); document.body.classList.toggle('is-product', view==='product'); document.documentElement.lang = 'en'; app.innerHTML = view==='owner' ? renderOwner() : renderShop(); if (view!=='owner') initCarousels(); chatRender(true); }
let lastFocus = null;
function initCarousels(){
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  [['btrack','bdots',true],['gtrack','gdots',false]].forEach(([tid,did,auto])=>{
    const tr=document.getElementById(tid), dots=document.getElementById(did); if(!tr) return;
    const idx = () => Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth));
    tr.addEventListener('scroll', ()=>{ if(dots) [...dots.children].forEach((d,i)=>d.classList.toggle('on', i===idx())); }, {passive:true});
    if (auto && !reduce && tr.children.length>1){
      let hold=0; ['pointerdown','touchstart','focusin'].forEach(ev=>tr.addEventListener(ev,()=>{ hold=Date.now(); },{passive:true}));
      window._bt = setInterval(()=>{ if (document.hidden || Date.now()-hold<8000 || !document.contains(tr)) return; const n=(idx()+1)%tr.children.length; tr.scrollTo({left:n*tr.clientWidth, behavior:'smooth'}); }, 5000);
    }
  });
}
function renderModal(){
  if (!M){ modalRoot.innerHTML=''; document.body.classList.remove('modal-open'); return; }
  document.body.classList.add('modal-open');
